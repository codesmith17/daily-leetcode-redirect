name: Sync Daily POTD (LeetCode, GFG & takeUforward)

on:
  schedule:
    # 18:30 UTC = 00:00 IST (GeeksforGeeks & takeUforward POTD reset)
    # Staggered offsets to prevent GitHub Actions cron queue delays
    - cron: "31 18 * * *"
    - cron: "35 18 * * *"
    - cron: "40 18 * * *"
    - cron: "45 18 * * *"
    - cron: "55 18 * * *"
    - cron: "5 19 * * *"
    # 00:00 UTC = 05:30 IST (LeetCode POTD reset)
    # Staggered offsets around 05:30 AM IST
    - cron: "1 0 * * *"
    - cron: "5 0 * * *"
    - cron: "15 0 * * *"
    - cron: "30 0 * * *"
    - cron: "45 0 * * *"
    # Off-peak hourly sync (minute 23 avoids the :00 and :30 congestion)
    - cron: "23 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-daily-potd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Sync POTD challenges & regenerate pages
        run: go run ./scripts

      - name: Commit and push if files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html leetcode/ gfg/ tuf/ data/
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to commit."
          else
            git commit -m "chore: sync daily POTD challenges ($(date -u +%F))"
            git pull --rebase origin main
            git push origin main
          fi

