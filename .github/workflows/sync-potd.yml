name: Sync Daily POTD (LeetCode & GeeksforGeeks)

on:
  schedule:
    # 18:30 UTC = 00:00 IST (GeeksforGeeks POTD reset)
    - cron: "30 18 * * *"
    - cron: "45 18 * * *"
    # 00:00 UTC = 05:30 IST (LeetCode POTD reset)
    - cron: "0 0 * * *"
    - cron: "15 0 * * *"
    - cron: "30 0 * * *"
    # Hourly fallback sync
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-daily-potd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync POTD challenges & regenerate pages
        run: python scripts/sync-potd.py

      - name: Commit and push if files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html leetcode.html leetcode/index.html gfg.html gfg/index.html data/leetcode.json data/gfg.json data/daily.json
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to commit."
          else
            git commit -m "chore: sync daily POTD challenges ($(date -u +%F))"
            git push
          fi
