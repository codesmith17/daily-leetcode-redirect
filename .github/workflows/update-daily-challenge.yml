name: Sync Daily LeetCode Redirect

on:
  schedule:
    # Run at midnight UTC, with catch-up runs and hourly fallback
    - cron: "0 0 * * *"
    - cron: "15 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-daily-redirect
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch today's challenge and rebuild index.html
        run: python scripts/sync-daily-challenge.py

      - name: Commit and push if files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/daily.json
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to commit."
          else
            git commit -m "chore: sync daily challenge ($(date -u +%F))"
            git push
          fi

