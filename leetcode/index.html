<!doctype html>
<html lang="en" data-platform="leetcode" data-difficulty="medium">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetCode POTD</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex">
  <link rel="icon" id="favicon" type="image/png" href="../assets/icons/leetcode.png">
  <link rel="apple-touch-icon" id="apple-icon" href="../assets/icons/leetcode.png">
  <style>
    /* Base Color Tokens */
    :root {
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --muted: #475569;
      --easy: #10b981;
      --medium: #38bdf8;
      --hard: #f43f5e;
      --border: rgba(255, 255, 255, 0.08);
      --diff-glow: transparent;
    }

    /* LeetCode Dynamic Theme */
    [data-platform="leetcode"] {
      --bg: #070a0e;
      --card-bg-start: rgba(14, 18, 26, 0.95);
      --card-bg-end: rgba(8, 11, 16, 0.98);
      --surface: #0e121a;
      --surface-elevated: #161c28;
      --surface-hover: #1e2636;
      --accent: #ffa116;
      --accent-secondary: #f0883e;
      --accent-glow: rgba(255, 161, 22, 0.22);
      --ambient-glow: rgba(255, 161, 22, 0.12);
      --border-accent: rgba(255, 161, 22, 0.4);
      --btn-gradient: linear-gradient(135deg, #ffa116, #ea580c);
      --btn-hover: linear-gradient(135deg, #ffb23f, #f97316);
      --btn-shadow: rgba(240, 136, 62, 0.35);
    }

    /* GeeksforGeeks Dynamic Theme */
    [data-platform="gfg"] {
      --bg: #060e09;
      --card-bg-start: rgba(12, 24, 17, 0.95);
      --card-bg-end: rgba(7, 16, 11, 0.98);
      --surface: #0a160f;
      --surface-elevated: #102217;
      --surface-hover: #162e20;
      --accent: #22c55e;
      --accent-secondary: #16a34a;
      --accent-glow: rgba(34, 197, 94, 0.22);
      --ambient-glow: rgba(34, 197, 94, 0.12);
      --border-accent: rgba(34, 197, 94, 0.4);
      --btn-gradient: linear-gradient(135deg, #22c55e, #15803d);
      --btn-hover: linear-gradient(135deg, #4ade80, #16a34a);
      --btn-shadow: rgba(34, 197, 94, 0.35);
    }

    /* takeUforward (TUF+) Dynamic Theme */
    [data-platform="tuf"] {
      --bg: #070b14;
      --card-bg-start: rgba(12, 18, 32, 0.95);
      --card-bg-end: rgba(7, 11, 20, 0.98);
      --surface: #0c1220;
      --surface-elevated: #111a2e;
      --surface-hover: #17243e;
      --accent: #327cf6;
      --accent-secondary: #f59e0b;
      --accent-glow: rgba(50, 124, 246, 0.28);
      --ambient-glow: rgba(50, 124, 246, 0.16);
      --border-accent: rgba(50, 124, 246, 0.45);
      --btn-gradient: linear-gradient(135deg, #2563eb, #1d4ed8);
      --btn-hover: linear-gradient(135deg, #3b82f6, #2563eb);
      --btn-shadow: rgba(37, 99, 235, 0.35);
    }

    /* Dynamic Difficulty Glow */
    [data-difficulty="easy"] { --diff-glow: rgba(16, 185, 129, 0.18); }
    [data-difficulty="medium"] { --diff-glow: rgba(56, 189, 248, 0.18); }
    [data-difficulty="hard"] { --diff-glow: rgba(244, 63, 94, 0.18); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, var(--ambient-glow) 0%, transparent 65%),
        radial-gradient(circle at 100% 100%, var(--diff-glow) 0%, transparent 40%),
        linear-gradient(180deg, var(--bg) 0%, #030712 100%);
      color: var(--text);
      font-family: ui-monospace, "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, monospace;
      padding: 20px;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }
    .card {
      width: 100%;
      max-width: 550px;
      background: linear-gradient(180deg, var(--card-bg-start), var(--card-bg-end));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 50px var(--ambient-glow), 0 0 35px var(--diff-glow);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
      opacity: 0.95;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .window-controls {
      display: flex;
      gap: 7px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .dot:hover { transform: scale(1.15); }
    .dot.red { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    .dot.yellow { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .dot.green { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    
    .nav-switches {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .nav-switch {
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .nav-switch:hover {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    [data-platform="leetcode"] .nav-lc,
    [data-platform="gfg"] .nav-gfg,
    [data-platform="tuf"] .nav-tuf {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Dynamic Brand Logos */
    .platform-logo {
      display: none;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    [data-platform="leetcode"] .leetcode-logo { display: flex; }
    [data-platform="gfg"] .gfg-logo { display: flex; }
    [data-platform="tuf"] .tuf-logo { display: flex; }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--border-accent);
    }
    
    .rewards-pill {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 9px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
    }
    [data-platform="tuf"] .rewards-pill { display: inline-flex; }

    .title-section {
      margin-bottom: 16px;
    }
    .problem-id {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .problem-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      letter-spacing: -0.02em;
      word-break: break-word;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .pill-difficulty {
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pill-difficulty.easy {
      color: var(--easy);
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.35);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.18);
    }
    .pill-difficulty.medium {
      color: var(--medium);
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.18);
    }
    .pill-difficulty.hard {
      color: var(--hard);
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.35);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.18);
    }
    .topic-tag {
      color: var(--tag-color, #94a3b8);
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .topic-tag:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--tag-color, rgba(255, 255, 255, 0.2));
    }
    .topic-tag svg {
      flex-shrink: 0;
    }
    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 22px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label {
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-value {
      font-weight: 600;
      color: var(--text);
    }
    .status-value.countdown {
      font-size: 15px;
      color: var(--accent);
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-secondary) 100%);
      transform-origin: left;
      transition: transform 0.05s linear;
    }
    .action-group {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--btn-gradient);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 18px var(--btn-shadow);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--btn-shadow);
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 16px;
      background: var(--surface-elevated);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: var(--surface-hover);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .kbd-hint {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      color: var(--text-dim);
    }
    .pulsing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>

  <script>
    (function() {
      // Platform Configuration Dictionary
      const PLATFORMS = {
        leetcode: {
          name: "LeetCode",
          cta: "Solve on LeetCode",
          resetHours: 0,
          resetMins: 0,
          resetLabel: "00:00 UTC (05:30 AM IST)",
          icon: "leetcode.png",
          defaultPOTDUrl: "https://leetcode.com/problem-list/daily-question/",
          timeZone: "UTC"
        },
        gfg: {
          name: "GeeksforGeeks",
          cta: "Solve on GeeksforGeeks",
          resetHours: 18,
          resetMins: 30,
          resetLabel: "12:00 AM IST (18:30 UTC)",
          icon: "gfg.png",
          defaultPOTDUrl: "https://www.geeksforgeeks.org/problem-of-the-day",
          timeZone: "Asia/Kolkata"
        },
        tuf: {
          name: "takeUforward",
          cta: "Solve on takeUforward",
          resetHours: 18,
          resetMins: 30,
          resetLabel: "12:00 AM IST (18:30 UTC)",
          icon: "tuf.png",
          defaultPOTDUrl: "https://takeuforward.org/potd",
          timeZone: "Asia/Kolkata"
        }
      };

      // Detect active platform from path or attribute or query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const queryPlatform = urlParams.get("platform") || urlParams.get("p");
      const path = window.location.pathname.toLowerCase();

      let platform = queryPlatform;
      if (!platform || !PLATFORMS[platform]) {
        if (path.includes("/gfg")) platform = "gfg";
        else if (path.includes("/tuf")) platform = "tuf";
        else if (path.includes("/leetcode")) platform = "leetcode";
        else {
          const attr = document.documentElement.getAttribute("data-platform");
          platform = (attr && PLATFORMS[attr]) ? attr : "leetcode";
        }
      }

      document.documentElement.setAttribute("data-platform", platform);
      const pConfig = PLATFORMS[platform] || PLATFORMS.leetcode;

      // Dynamic subpath resolution
      const isSubdir = path.includes('/tuf') || path.includes('/leetcode') || path.includes('/gfg');
      const basePath = isSubdir ? "../data/" : "data/";
      const iconBasePath = isSubdir ? "../assets/icons/" : "assets/icons/";

      // Navigation switch links & icons
      const navLcBtn = document.getElementById("nav-lc-btn");
      const navGfgBtn = document.getElementById("nav-gfg-btn");
      const navTufBtn = document.getElementById("nav-tuf-btn");
      if (navLcBtn) navLcBtn.href = isSubdir ? "../leetcode" : "./leetcode";
      if (navGfgBtn) navGfgBtn.href = isSubdir ? "../gfg" : "./gfg";
      if (navTufBtn) navTufBtn.href = isSubdir ? "../tuf" : "./tuf";

      const navLcImg = document.getElementById("nav-lc-img");
      const navGfgImg = document.getElementById("nav-gfg-img");
      const navTufImg = document.getElementById("nav-tuf-img");
      if (navLcImg) navLcImg.src = iconBasePath + "leetcode.png";
      if (navGfgImg) navGfgImg.src = iconBasePath + "gfg.png";
      if (navTufImg) navTufImg.src = iconBasePath + "tuf.png";

      // Favicon & initial texts
      const favicon = document.getElementById("favicon");
      if (favicon && pConfig.icon) {
        favicon.type = "image/png";
        favicon.href = iconBasePath + pConfig.icon;
      }
      const appleIcon = document.getElementById("apple-icon");
      if (appleIcon && pConfig.icon) {
        appleIcon.href = iconBasePath + pConfig.icon;
      }
      document.title = `${pConfig.name} POTD`;

      const titleEl = document.getElementById("problem-title");
      const idEl = document.getElementById("problem-id");
      const btnCta = document.getElementById("btn-cta-text");
      const redirectLabel = document.getElementById("redirect-label");
      const redirectBtn = document.getElementById("btn-redirect");
      const cancelBtn = document.getElementById("btn-cancel");
      const countdownEl = document.getElementById("countdown-text");
      const progressBar = document.getElementById("progress-bar");
      const localDateEl = document.getElementById("local-date");
      const resetInEl = document.getElementById("reset-in-text");
      const pillsContainer = document.getElementById("pills-container");
      const diffPill = document.getElementById("pill-difficulty");
      const footerSynced = document.getElementById("footer-synced");

      if (btnCta) btnCta.textContent = pConfig.cta;
      if (redirectLabel) redirectLabel.textContent = `Redirecting to ${pConfig.name}`;

      let targetUrl = pConfig.defaultPOTDUrl;
      let autoRedirectCancelled = false;

      // Topic icon and color map
      const topicRegistry = {
        "dynamic programming": { color: "#c084fc", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/><path d="M15 21V9"/></svg>` },

        "queue":               { color: "#2dd4bf", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/><circle cx="5" cy="12" r="2"/></svg>` },

        "binary tree":         { color: "#4ade80", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><circle cx="6" cy="19" r="3"/><circle cx="18" cy="19" r="3"/><path d="M12 8v4"/><path d="M12 12l-4 4"/><path d="M12 12l4 4"/></svg>` },

        "sorting":             { color: "#a78bfa", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>` },
        "greedy":              { color: "#e879f9", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/></svg>` },
        "binary search":       { color: "#34d399", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>` },
        "dfs":                 { color: "#38bdf8", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M18 15l-6 6-6-6"/></svg>` },
        "bfs":                 { color: "#38bdf8", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 0 0 0 18"/><path d="M12 7a5 5 0 0 0 0 10"/><path d="M12 11a1 1 0 0 0 0 2"/></svg>` },
        "string":              { color: "#fbbf24", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>` },
        "hash":                { color: "#fb7185", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>` },
        "two pointers":        { color: "#818cf8", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8L22 12L18 16"/><path d="M2 12H22"/><path d="M6 16L2 12L6 8"/></svg>` },
        "math":                { color: "#facc15", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/><line x1="12" y1="4" x2="12" y2="20"/></svg>` },
        "bit manipulation":    { color: "#38bdf8", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M7 6l-4 6 4 6"/><path d="M17 6l4 6-4 6"/></svg>` },
        "dsa":                 { color: "#3b82f6", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>` },
        "tuf":                 { color: "#327cf6", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>` }
      };

      function renderTopicTags(tags) {
        if (!pillsContainer || !tags || !tags.length) return;
        const currentDiffPill = document.getElementById("pill-difficulty");
        pillsContainer.innerHTML = "";
        if (currentDiffPill) pillsContainer.appendChild(currentDiffPill);

        tags.slice(0, 4).forEach(tag => {
          const tLower = tag.toLowerCase();
          let style = { color: "#94a3b8", icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg>` };
          for (const [key, val] of Object.entries(topicRegistry)) {
            if (tLower.includes(key)) {
              style = val;
              break;
            }
          }
          const span = document.createElement("span");
          span.className = "pill topic-tag";
          span.style.setProperty("--tag-color", style.color);
          span.innerHTML = `${style.icon}<span>${escapeText(tag)}</span>`;
          pillsContainer.appendChild(span);
        });
      }

      function escapeText(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function isChallengeExpired(challengeDate, timeZone) {
        if (!challengeDate || challengeDate.length < 10) return false;
        try {
          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: timeZone || 'UTC',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }).format(new Date());
          return challengeDate.slice(0, 10) < today;
        } catch (e) {
          const todayUtc = new Date().toISOString().slice(0, 10);
          return challengeDate.slice(0, 10) < todayUtc;
        }
      }

      // Compute local date
      const now = new Date();
      if (localDateEl) {
        localDateEl.textContent = now.toLocaleDateString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric'
        });
      }

      function updateResetCountdown() {
        const current = new Date();
        const nextReset = new Date(current);
        nextReset.setUTCHours(pConfig.resetHours, pConfig.resetMins, 0, 0);
        if (current.getTime() >= nextReset.getTime()) {
          nextReset.setUTCDate(nextReset.getUTCDate() + 1);
        }
        const diffMs = nextReset.getTime() - current.getTime();
        const hrs = Math.floor(diffMs / 3600000);
        const mins = Math.floor((diffMs % 3600000) / 60000);
        if (resetInEl) {
          resetInEl.textContent = `${hrs}h ${mins}m (${pConfig.resetLabel})`;
        }
      }
      updateResetCountdown();
      setInterval(updateResetCountdown, 30000);

      function applyPOTDData(data) {
        if (!data || !data.url) return;
        targetUrl = data.url;
        if (redirectBtn) redirectBtn.href = data.url;
        if (titleEl && data.title) titleEl.textContent = data.title;
        if (idEl) {
          if (data.id) {
            idEl.textContent = data.id.startsWith("#") ? "Problem " + data.id : "Problem #" + data.id;
          } else {
            idEl.textContent = "Daily Challenge";
          }
        }
        if (diffPill && data.difficulty) {
          diffPill.textContent = data.difficulty;
          const diffCls = (data.difficultyClass || data.difficulty).toLowerCase();
          diffPill.className = "pill pill-difficulty " + diffCls;
          document.documentElement.setAttribute("data-difficulty", diffCls);
        }
        if (data.tags) renderTopicTags(data.tags);
        if (footerSynced && data.syncedAt) footerSynced.textContent = "Synced: " + data.syncedAt;
        if (redirectLabel) redirectLabel.textContent = `Redirecting to ${pConfig.name}`;
        if (btnCta) btnCta.textContent = pConfig.cta;
        document.title = `${data.title} — ${pConfig.name} POTD`;
      }

      // Try calling live platform API directly with a quick timeout
      async function tryDirectAPIFetch() {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1800);

        try {
          if (platform === "gfg") {
            const resp = await fetch("https://practiceapi.geeksforgeeks.org/api/vr/problems-of-day/problem/today/", {
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (resp.ok) {
              const json = await resp.json();
              if (json && json.problem_url) {
                applyPOTDData({
                  title: json.problem_name || "Today's GeeksforGeeks POTD",
                  url: json.problem_url,
                  difficulty: json.difficulty || "Medium",
                  difficultyClass: (json.difficulty || "medium").toLowerCase(),
                  id: json.id ? String(json.id) : "",
                  tags: (json.tags && json.tags.topic_tags) ? json.tags.topic_tags : []
                });
                return;
              }
            }
          } else if (platform === "tuf") {
            const resp = await fetch("https://backend-go.takeuforward.org/api/v1/potd/today?track=dsa", {
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (resp.ok) {
              const json = await resp.json();
              const track = json && json.data && json.data.tracks && json.data.tracks[0];
              if (track && track.problem && track.problem.slug) {
                applyPOTDData({
                  title: track.problem.name || "Today's takeUforward POTD",
                  url: "https://takeuforward.org/practice/dsa/" + track.problem.slug,
                  difficulty: track.problem.difficulty || "Core",
                  difficultyClass: "medium",
                  id: "#" + track.problem.problem_id,
                  tags: ["DSA", "TUF+ POTD"]
                });
                return;
              }
            }
          } else if (platform === "leetcode") {
            const resp = await fetch("https://leetcode.com/graphql", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                query: "query { activeDailyCodingChallengeQuestion { date link question { title difficulty } } }"
              }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (resp.ok) {
              const json = await resp.json();
              const q = json && json.data && json.data.activeDailyCodingChallengeQuestion;
              if (q && q.link) {
                applyPOTDData({
                  title: (q.question && q.question.title) || "Today's LeetCode POTD",
                  url: "https://leetcode.com" + q.link,
                  difficulty: (q.question && q.question.difficulty) || "Medium",
                  difficultyClass: ((q.question && q.question.difficulty) || "medium").toLowerCase(),
                  id: ""
                });
                return;
              }
            }
          }
        } catch (e) {
          clearTimeout(timeoutId);
        }
      }

      async function loadPOTD() {
        let isExpired = false;
        try {
          const resp = await fetch(basePath + platform + ".json?t=" + Date.now(), { cache: "no-store" });
          if (resp.ok) {
            const data = await resp.json();
            if (data && data.url) {
              isExpired = isChallengeExpired(data.date, pConfig.timeZone);
              if (!isExpired) {
                applyPOTDData(data);
                return;
              }
            }
          }
        } catch (e) {
          console.warn("Could not fetch " + platform + ".json", e);
        }

        // If JSON is expired or failed to load, set safe live portal fallback and try direct API
        targetUrl = pConfig.defaultPOTDUrl;
        if (redirectBtn) redirectBtn.href = pConfig.defaultPOTDUrl;
        if (titleEl) titleEl.textContent = `Today's Challenge (Refreshing...)`;
        if (btnCta) btnCta.textContent = "Open Live POTD";
        if (redirectLabel) redirectLabel.textContent = `Opening Live ${pConfig.name} POTD`;
        document.title = `Today's ${pConfig.name} POTD`;

        await tryDirectAPIFetch();
      }

      loadPOTD();

      // Countdown redirect logic
      const DURATION = 2500;
      const startTime = performance.now();

      function tick(now) {
        if (autoRedirectCancelled) return;
        const elapsed = now - startTime;
        const remaining = Math.max(0, DURATION - elapsed);
        const progress = Math.max(0, Math.min(1, 1 - (remaining / DURATION)));

        if (countdownEl) {
          countdownEl.textContent = (remaining / 1000).toFixed(1) + "s";
        }
        if (progressBar) {
          progressBar.style.transform = `scaleX(${progress})`;
        }

        if (remaining <= 0) {
          window.location.replace(targetUrl);
        } else {
          requestAnimationFrame(tick);
        }
      }
      requestAnimationFrame(tick);

      function cancelRedirect() {
        autoRedirectCancelled = true;
        if (countdownEl) countdownEl.textContent = "Paused";
        if (cancelBtn) {
          cancelBtn.textContent = "Resume";
          cancelBtn.onclick = resumeRedirect;
        }
      }

      function resumeRedirect() {
        window.location.replace(targetUrl);
      }

      if (cancelBtn) {
        cancelBtn.addEventListener("click", cancelRedirect);
      }

      // Keyboard shortcuts
      window.addEventListener("keydown", function(e) {
        if (e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          window.location.replace(targetUrl);
        } else if (e.code === "KeyC" || e.code === "Escape") {
          cancelRedirect();
        } else if (e.code === "KeyR") {
          window.location.reload();
        }
      });
    })();
  </script>
</body>
</html>
